name: Stream A validation

on:
  push:
    branches:
      - stream-a-validation-20260907

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Stream A validation bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install
        run: |
          pnpm config set dangerouslyAllowAllBuilds true
          pnpm install --frozen-lockfile
      - name: Server tests
        run: pnpm exec vitest run --root . src/server
