name: Stream A validation

on:
  push:
    branches:
      - stream-a-validation-20260907

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Stream A validation bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Apply final server-test patch
        run: python .github/stream-a-scope-test-fix.py
      - name: Install
        run: |
          pnpm config set dangerouslyAllowAllBuilds true
          pnpm install --frozen-lockfile
      - name: Server tests
        run: pnpm exec vitest run --root . src/server
      - name: Commit server-test patch
        run: |
          git config user.name "Fabian Wiles"
          git config user.email "fabianwiles@canva.com"
          git add src/server/scope-runtime.test.ts
          git commit -m "Update scope runtime tests for data-only connection state"
          git push origin HEAD:stream-a-validation-20260907
